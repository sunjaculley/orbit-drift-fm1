# Builds the firmware and publishes the site (emulator, installer, rescue) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions. Tags (v0.2) also get a release with the .fwsc.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - name: Look up crash addresses (set in the step)
        if: always()
        run: |
          python3 - <<'PY'
          import re
          lines = open('build/fm1/firmware.dis').read().split('\n')
          for want in ['200563c', '2005494']:
              fn = '?'
              for i, l in enumerate(lines):
                  if re.match(r'^[0-9a-f]+ <.*>:$', l): fn = l
                  if l.strip().startswith(want + ':'):
                      print('=====', want, 'in', fn)
                      print('\n'.join(lines[max(0, i - 40):i + 6]))
                      break
          PY
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
